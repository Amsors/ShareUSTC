# ShareUSTC 前端 nginx 站点配置
# 托管 SPA + 反代后端 /api、/images。upstream 主机名为 compose 服务名 backend。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限需与后端 MAX_FILE_SIZE（100MB）保持一致，否则大文件上传会被 nginx 提前 413
    client_max_body_size 100m;

    # gzip 静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback：前端使用 history 路由（createWebHistory），未命中的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 已构建的带哈希指纹的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代：透传原始 URI（/api/...）到后端
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 资源下载（/api/resources/{id}/download 流式回吐）：关闭代理缓冲、放宽读写超时
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 图片反代：后端图片路由为 /images/{id}（不含 /api 前缀），浏览器直连
    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
