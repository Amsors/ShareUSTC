[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# 项目 lint 门禁，规则依据见 dev_docs/specs/backend_standards.md
# 这些规则是强制门禁；测试代码的 unwrap/expect 豁免见 clippy.toml
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"

[dependencies]
actix-web = { version = "4", features = ["cookies"] }
actix-cors = "0.6"
actix-multipart = "0.6"
mime = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
argon2 = "0.5"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
futures-util = "0.3"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
zip = "0.6"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
csv = "1.3"
calamine = "0.24"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
    "json"
]
